name: Snyk Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 8
        uses: actions/setup-java@v4.7.1
        with:
          java-version: "8"
          distribution: temurin
          cache: maven

      # SCA — scant alle Maven dependencies op CVE's
      # --severity-threshold=high → alleen HIGH en CRITICAL tonen
      # --all-projects → scant api/ en omod/ allebei
      - name: Snyk SCA — dependency scan
        uses: snyk/actions/maven@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --all-projects
            --json-file-output=snyk-sca.json

      # SAST — scant broncode op CWE's (hardcoded credentials, XSS, etc.)
      - name: Snyk SAST — code scan
        uses: snyk/actions/node@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: >
            --severity-threshold=high
            --json-file-output=snyk-sast.json

      # Upload beide rapporten als CI-artifact
      # Downloadbaar via Actions → snyk-rapporten
      - name: Upload Snyk rapporten
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: snyk-rapporten
          path: |
            snyk-sca.json
            snyk-sast.json
