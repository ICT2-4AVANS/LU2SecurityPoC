name: Snyk Security Scan

on:
push:
branches: [main, dev]
pull_request:
branches: [main, dev]

permissions:
contents: read

jobs:
snyk:
runs-on: ubuntu-22.04


steps:
  - name: Checkout repository
    uses: actions/checkout@v4.2.2
    with:
      persist-credentials: false

  - name: Set up Java 8
    uses: actions/setup-java@v4.7.1
    with:
      java-version: "8"
      distribution: temurin
      cache: maven

  - name: Check Java and Maven
    run: |
      echo "JAVA_HOME=$JAVA_HOME"
      java -version
      mvn -version

  - name: Install Snyk CLI
    run: npm install -g snyk

  - name: Snyk SCA dependency scan
    continue-on-error: true
    working-directory: openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    run: |
      snyk test \
        --severity-threshold=high \
        --all-projects \
        --json-file-output=../../../snyk-sca.json

  - name: Snyk SAST code scan
    continue-on-error: true
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    run: |
      snyk code test \
        --severity-threshold=high \
        --json-file-output=snyk-sast.json

  - name: Upload Snyk rapporten
    uses: actions/upload-artifact@v4.6.2
    if: always()
    with:
      name: snyk-rapporten
      path: |
        snyk-sca.json
        snyk-sast.json

