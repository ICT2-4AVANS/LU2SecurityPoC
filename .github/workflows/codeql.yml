name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.36.2
        with:
          languages: java
          build-mode: none
          # security-extended voegt extra beveiligingschecks toe:
          # - java/hardcoded-credential  → hardcoded wachtwoorden in code
          # - java/sensitive-log         → gevoelige data in logs
          # - java/insecure-cookie       → sessiecookies zonder beveiliging
          queries: security-extended
      - uses: github/codeql-action/analyze@v4.36.2
