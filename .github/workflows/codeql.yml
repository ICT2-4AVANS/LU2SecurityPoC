name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: github/codeql-action/init@v3.28.18
        with:
          languages: java
          build-mode: none
      - uses: github/codeql-action/analyze@v3.28.18
