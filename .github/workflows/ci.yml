name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 8
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.0
        with:
          java-version: "8"
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling
        run: mvn --batch-mode verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e7e1d9b5b5b8e9c2d4 # v4.6.2
        with:
          name: test-results
          path: |
            openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling/**/target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e7e1d9b5b5b8e9c2d4 # v4.6.2
        with:
          name: coverage-report
          if-no-files-found: warn
          path: |
            openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling/**/target/site/jacoco/
