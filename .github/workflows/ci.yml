name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 8
        uses: actions/setup-java@v4.2.0
        with:
          java-version: "8"
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling
        run: mvn --batch-mode verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-results
          path: |
            openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling/**/target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-report
          if-no-files-found: warn
          path: |
            openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling/**/target/site/jacoco/
