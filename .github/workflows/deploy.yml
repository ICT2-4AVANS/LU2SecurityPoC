name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-test:
    name: Deploy to test
    runs-on: ubuntu-24.04
    environment: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # NOTE: deze job draait op een ephemere GitHub-hosted runner.
      # Voor een persistente testomgeving is een self-hosted runner of
      # een externe deploy-target (bijv. SSH naar een server) vereist.
      - name: Deploy to test environment
        run: |
          echo "Deploying to test environment"
          docker compose --env-file .env.test -f docker-compose.test.yml up -d
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-24.04
    needs: deploy-test
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # NOTE: zie deploy-test — voor echte productie is een self-hosted runner
      # of externe deploy-target vereist. De handmatige goedkeuring via de
      # GitHub Environment protection rule is wel actief.
      - name: Deploy to production environment
        run: |
          echo "Deploying to production environment"
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
