name: Generate SBOM

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4.6.2
        with:
          name: sbom
          path: sbom.cyclonedx.json

      # Grype scant het gegenereerde SBOM bestand op CVE's
      # fail-build: false → pipeline stopt niet, maar bevindingen zijn wel zichtbaar
      # severity-cutoff: high → rapporteert alleen HIGH en CRITICAL
      - name: Scan SBOM op CVEs met Grype
        uses: anchore/scan-action@v6.1.0
        id: grype
        with:
          sbom: sbom.cyclonedx.json
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      # SARIF formaat zodat bevindingen zichtbaar zijn in GitHub Security tab
      - name: Upload Grype resultaten naar GitHub Security
        uses: github/codeql-action/upload-sarif@v3.28.18
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
