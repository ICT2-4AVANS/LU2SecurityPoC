name: Jacoco coverage

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 8
        uses: actions/setup-java@v4.2.0
        with:
          java-version: "8"
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling
        run: mvn --batch-mode verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-results
          path: |
            openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling/**/target/surefire-reports/

      - name: Print coverage summary
        if: always()
        working-directory: openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling
        run: |
          set -e
          shopt -s nullglob
          for csv in **/target/site/jacoco/jacoco.csv; do
            echo "::group::Coverage summary for $csv"
            awk -F, 'NR==1 { for (i=1;i<=NF;i++) h[$i]=i; next }
                     { miss_l+=$h["LINE_MISSED"]; cov_l+=$h["LINE_COVERED"];
                       miss_b+=$h["BRANCH_MISSED"]; cov_b+=$h["BRANCH_COVERED"] }
                     END {
                       tot_l = miss_l + cov_l; tot_b = miss_b + cov_b;
                       pct_l = (tot_l>0) ? cov_l*100.0/tot_l : 0;
                       pct_b = (tot_b>0) ? cov_b*100.0/tot_b : 0;
                       printf "Line coverage:   %.2f%% (%d / %d)\n", pct_l, cov_l, tot_l;
                       printf "Branch coverage: %.2f%% (%d / %d)\n", pct_b, cov_b, tot_b;
                     }' "$csv"
            echo "::endgroup::"
          done

      - name: Upload coverage report (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-report-jacoco
          if-no-files-found: warn
          path: |
            openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling/**/target/site/jacoco/
