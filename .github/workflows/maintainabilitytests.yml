name: maintainability-tests

# Onderhoudbaarheids-testpijplijn (bulletpoint 2 van LU2).
# Bewust gescheiden van de bestaande ci.yml zodat die voor andere
# doeleinden kan blijven draaien op main.
#
# CI-implementatie van de teststrategie uit
# docs/onderhoudbaarheid/02-teststrategie.md.
#
# E1: alle gekozen testtypen (T1 unit, T2 JaCoCo coverage, T3 PIT
#     mutation, T4 SonarCloud Quality Gate) draaien hier.
# E2: rapporten worden als artifact ge-upload (Surefire, JaCoCo, PIT).
# E3: build faalt expliciet bij NFR-overtreding:
#       - jacoco:check faalt onder de drempel (MNT-3 / MNT-3a/b)
#       - pitest:mutationCoverage faalt onder mutation threshold (MNT-3c)
#       - SonarCloud Quality Gate failure blokkeert merge (MNT-4)
#
# Eén-job-opzet: Sonar moet de gecompileerde .class-bestanden zien om
# sonar.java.binaries te kunnen vullen. Daarom doen we build + Sonar
# binnen dezelfde workspace. We installeren JDK 8 voor de OpenMRS-
# build (Hibernate 3 + Spring 3 breken op nieuwere JDKs) en switchen
# daarna naar JDK 17 voor het Sonar-scanner-proces zelf (>=5.x vereist
# JDK 17).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  maintainability:
    name: T1+T2+T3+T4 — unit / coverage / mutation / Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_DIR: openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling/api
      MODULE_DIR: openmrs-module-appointmentscheduling/openmrs-module-appointmentscheduling

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar heeft de volledige history nodig voor blame / new-code-detectie.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 8 (build)
        id: jdk8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: T1+T2 — Surefire + JaCoCo (faalt bij coverage < drempel)
        working-directory: ${{ env.API_DIR }}
        run: mvn -B clean verify

      - name: T3 — PIT mutation testing (faalt bij mutation-score < 50%)
        working-directory: ${{ env.API_DIR }}
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      - name: Set up JDK 17 (Sonar scanner)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: T4 — SonarCloud Quality Gate (MNT-4)
        working-directory: ${{ env.API_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=ict2-4avans-2 \
            -Dsonar.projectKey=ICT2-4AVANS_LU2SecurityPoC2 \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true
        # Sonar draait bewust op de api-module (niet op de parent reactor):
        #   - Onze teststrategie (02-teststrategie.md §1) heeft api als scope;
        #     omod valt al buiten coverage- en mutation-toetsing.
        #   - Single-module scan = target/classes wordt automatisch
        #     gedetecteerd; geen sonar.java.binaries-override nodig en
        #     geen multi-module pad-inheritance-problemen.
        #   - Omod compileert alleen als de maven-openmrs-plugin-extensie
        #     in CI binnenkomt; voor de NFR-gate (Java-laag) is dat niet
        #     nodig. De historische full-project-scan blijft op SonarCloud
        #     staan als baseline voor de JSP/JS-bevindingen uit
        #     01-systematische-analyse.md §4.2.
        # -Dsonar.qualitygate.wait=true: E3 — faalt de step bij Quality
        #   Gate != Passed, waardoor MNT-4-overtredingen merges tegenhouden.

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: ${{ env.API_DIR }}/target/surefire-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ${{ env.API_DIR }}/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: ${{ env.API_DIR }}/target/pit-reports/
          if-no-files-found: warn
