name: Dependency Review

on:
  pull_request:
    branches: [main]

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@ce3cf9537a52e8119d91fd484ab5dc8e3e853d6a # v4.6.0
        with:
          fail-on-severity: high
