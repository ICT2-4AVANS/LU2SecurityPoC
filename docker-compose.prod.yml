version: "3.8"
services:
  openmrs:
    image: openmrs/openmrs-reference-application:2.13.0
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "80:8080"
  db:
    # MySQL 5.7 EOL maar vereist door OpenMRS 1.x platformcompatibiliteit
    image: mysql:5.7.44
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: openmrs_prod
