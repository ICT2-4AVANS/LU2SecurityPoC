version: "3.8"
services:
  openmrs:
    image: openmrs/openmrs-reference-application:latest
    environment:
      DB_HOST: db
      DB_PASSWORD: dev_password
      OPENMRS_AUTO_UPDATE_DATABASE: "true"
    ports:
      - "8080:8080"
    volumes:
      - openmrs_dev_data:/usr/local/tomcat/.OpenMRS
    depends_on:
      - db
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: dev_password
      MYSQL_DATABASE: openmrs_dev
    ports:
      - "3306:3306"
    volumes:
      - db_dev_data:/var/lib/mysql

volumes:
  openmrs_dev_data:
  db_dev_data:
