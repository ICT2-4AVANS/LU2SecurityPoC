version: "3.8"
services:
  openmrs:
    image: openmrs/openmrs-reference-application:2.13.0
    environment:
      DB_HOST: db
      DB_PASSWORD: dev_only_not_secret
    ports:
      - "8082:8080"
    volumes:
      - openmrs_dev_data:/usr/local/tomcat/.OpenMRS
  db:
    # MySQL 5.7 is EOL maar vereist door OpenMRS 1.x — upgrade naar 8.x wordt
    # geblokkeerd door platformcompatibiliteit. Zie docs/non-functional-requirements.md.
    image: mysql:5.7.44
    environment:
      MYSQL_ROOT_PASSWORD: dev_only_not_secret
      MYSQL_DATABASE: openmrs_dev
    volumes:
      - mysql_dev_data:/var/lib/mysql

volumes:
  openmrs_dev_data:
  mysql_dev_data:
